services:
  marozero-controller:
    image: golang:1.24.2-alpine3.21
    container_name: marozero-controller
    command: ["sh", "-c", "sleep infinity"]
    networks:
      - twamp-interop-net
    healthcheck:
      test: ["CMD-SHELL", "test -f /etc/os-release"]
      interval: 3s
      timeout: 2s
      retries: 20

  perfsonar-toolkit:
    image: ghcr.io/perfsonar/toolkit:5.0.8
    container_name: perfsonar-toolkit
    command: ["sh", "-c", "sleep infinity"]
    networks:
      - twamp-interop-net
    healthcheck:
      test: ["CMD-SHELL", "test -f /etc/os-release"]
      interval: 3s
      timeout: 2s
      retries: 20

networks:
  twamp-interop-net:
    name: marozero-perfsonar-interop
    internal: true
